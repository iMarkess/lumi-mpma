name: 1 - Gerar chave de assinatura (uma vez)

# Roda manualmente (aba Actions → este workflow → Run workflow).
# Gera a keystore de upload, mostra o SHA-1 e o base64 pra você colar nos Secrets.

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Senha da keystore (guarde!)"
        required: true
      key_password:
        description: "Senha da chave (pode ser igual à de cima)"
        required: true
      alias:
        description: "Alias da chave"
        required: true
        default: "upload"

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerar keystore
        run: |
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "${{ github.event.inputs.alias }}" \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=LUMI, OU=MPMA, O=Ministerio Publico do Maranhao, L=Sao Luis, ST=MA, C=BR"

      - name: Mostrar SHA-1 e SHA-256 (para Google/Play)
        run: |
          echo "==================== FINGERPRINTS ===================="
          keytool -list -v -keystore upload-keystore.jks \
            -alias "${{ github.event.inputs.alias }}" \
            -storepass "${{ github.event.inputs.store_password }}" | grep -E "SHA1|SHA256"
          echo "======================================================"

      - name: Gerar base64 da keystore
        run: |
          base64 -w0 upload-keystore.jks > keystore.base64.txt
          echo "Tamanho base64: $(wc -c < keystore.base64.txt) bytes"

      - name: Subir artefatos (baixe e guarde!)
        uses: actions/upload-artifact@v4
        with:
          name: lumi-keystore
          # inclui a keystore (.jks) e o base64 pra colar no Secret
          path: |
            upload-keystore.jks
            keystore.base64.txt
          retention-days: 1
