name: lumi_sentinela
description: "LUMI - com você na proteção da vida: registre denúncias com segurança e sigilo e acompanhe pelo protocolo."
publish_to: "none"
# O versionCode (o número depois do +) precisa ser MAIOR que o último enviado
# à Play. Último publicado: 4 (1.0.3). Incremente a cada upload.
version: 1.0.4+5

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado / injeção
  flutter_riverpod: ^2.5.1
  # Navegação
  go_router: ^14.2.7
  # Tipografia (Lexend + Inter)
  google_fonts: ^6.2.1
  # Micro animações 60fps
  flutter_animate: ^4.5.0
  # Skeleton / shimmer loading
  shimmer: ^3.0.0
  # Biometria (login)
  local_auth: ^2.3.0
  # Login com Google (nativo)
  google_sign_in: ^6.2.1
  # HTTP (chamar a API do VPS)
  http: ^1.2.2
  # Cache local / preferências (tema, sessão)
  shared_preferences: ^2.3.2
  # Datas pt_BR
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Ícone adaptativo Android
  flutter_launcher_icons: ^0.14.1
  # Splash screen nativa
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

# ===== Ícone adaptativo (Play Store) =====
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 23
  remove_alpha_ios: true

# ===== Splash screen nativa =====
flutter_native_splash:
  color: "#F6F8FC"
  image: assets/icon/splash.png
  android_12:
    color: "#F6F8FC"
    image: assets/icon/splash.png
  color_dark: "#06122A"
  image_dark: assets/icon/splash.png
